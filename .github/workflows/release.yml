name: Create Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build  release ready version
        run: |
          name=$(basename "$PWD")
          num="${name##*[!0-9]}"
          TARGET="HA${num}_Volkov_Malzew"
          mkdir "$TARGET"
          cp -r src/java/progra25/aufgabe* "$TARGET"
          sed -i "/package progra25.aufgabe.*;/d" "$TARGET"/aufgabe*/*.java
          zip -r "$TARGET.zip" "$TARGET"

      - name: Create Release with Auto-Generated Notes
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
          files: |
            *.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
