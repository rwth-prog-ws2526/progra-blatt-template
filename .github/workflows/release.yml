name: Create Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build  release ready version
        run: |
          name=$(basename "$PWD")
          num="${name##*[!0-9]}"
          sed -i '/package rwth25.progra;/d' src/java/rwth25/progra/aufgabe*/*.java
          zip "HA${num}_(Volkov,_Malzew)" src/java/rwth25/progra/aufgabe*/*.java

      - name: Create Release with Auto-Generated Notes
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
          files: |
            *.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
